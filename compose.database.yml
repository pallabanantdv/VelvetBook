# Explicit opt-in local development only. Never point these ports at production.
services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: velvetbook
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: velvetbook_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - velvetbook_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velvetbook -d velvetbook_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  velvetbook_postgres:
